{% extends 'base.html' %}

{% block content %}

<div style="max-width:680px; margin:0 auto;">

    <div class="page-header" style="margin-bottom:1.5rem;">
        <div>
            <h1 class="page-title">
                <span data-en>Edit Complaint</span>
                <span data-np>उजुरी सम्पादन</span>
            </h1>
            <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.3rem;">
                {{ complaint.title }}
            </p>
        </div>
        <a href="/complaint/{{ complaint.id }}/" class="btn btn-ghost btn-sm">
            ← <span data-en>Cancel</span><span data-np>रद्द</span>
        </a>
    </div>

    <div class="card">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">
                    <span data-en>Title</span><span data-np>शीर्षक</span>
                    <span style="color:var(--red);">*</span>
                </label>
                <input type="text" name="title"
                    value="{{ complaint.title }}" required
                    class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span data-en>Category</span><span data-np>वर्ग</span>
                    <span style="color:var(--red);">*</span>
                </label>
                <select name="category" required class="form-input">
                    <option value="water"       {% if complaint.category == 'water' %}selected{% endif %}>💧 Khane Pani / खाने पानी</option>
                    <option value="road"        {% if complaint.category == 'road' %}selected{% endif %}>🛣️ Bato / बाटो</option>
                    <option value="electricity" {% if complaint.category == 'electricity' %}selected{% endif %}>⚡ Bijuli / बिजुली</option>
                    <option value="waste"       {% if complaint.category == 'waste' %}selected{% endif %}>🗑️ Fohor / फोहोर</option>
                    <option value="other"       {% if complaint.category == 'other' %}selected{% endif %}>📌 Aru / अरु</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span data-en>Description</span><span data-np>विवरण</span>
                    <span style="color:var(--red);">*</span>
                </label>
                <textarea name="description" rows="5" required
                    class="form-input" style="resize:vertical;">{{ complaint.description }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span data-en>Photo</span><span data-np>फोटो</span>
                    <span style="color:var(--text-light); font-weight:400; font-size:0.82rem; margin-left:0.3rem;">
                        (<span data-en>leave empty to keep current</span><span data-np>नराखे अहिलेकै रहन्छ</span>)
                    </span>
                </label>
                {% if complaint.photo %}
                <div style="margin-bottom:0.75rem;">
                    <img src="{{ complaint.photo.url }}"
                        style="width:100%; max-height:200px; object-fit:cover; border-radius:8px;">
                    <p style="font-size:0.8rem; color:var(--text-muted); margin-top:0.4rem;">
                        <span data-en>Current photo — upload new to replace</span>
                        <span data-np>हालको फोटो — बदल्न नयाँ अपलोड गर्नुस्</span>
                    </p>
                </div>
                {% endif %}
                <input type="file" name="photo" accept="image/*" class="form-input" style="padding:0.5rem;">
            </div>

            <div style="display:flex; gap:0.75rem;">
                <button type="submit" class="btn btn-primary" style="flex:1; padding:0.85rem;">
                    <span data-en>Save Changes</span>
                    <span data-np>परिवर्तन सुरक्षित गर्नुस्</span>
                </button>
                <a href="/complaint/{{ complaint.id }}/" class="btn btn-ghost" style="flex:1; padding:0.85rem; text-align:center;">
                    <span data-en>Cancel</span>
                    <span data-np>रद्द गर्नुस्</span>
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
