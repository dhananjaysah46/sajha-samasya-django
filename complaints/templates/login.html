{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:400px; margin:0 auto;">
    <h2 style="margin-bottom:1.5rem;">
        <span data-en>Login</span>
        <span data-np>लगइन</span>
    </h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom:1rem;">
            <label>Username</label><br>
            <input type="text" name="username" required style="width:100%; padding:0.7rem; border:1px solid #ddd; border-radius:6px; margin-top:0.3rem;">
        </div>
        <div style="margin-bottom:1.5rem;">
            <label>Password</label><br>
            <input type="password" name="password" required style="width:100%; padding:0.7rem; border:1px solid #ddd; border-radius:6px; margin-top:0.3rem;">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:0.8rem;">
            <span data-en>Login</span>
            <span data-np>लगइन</span>
        </button>
    </form>
    <p style="margin-top:1rem; text-align:center; color:#666;">
        <span data-en>No account?</span>
        <span data-np>खाता छैन?</span>
        <a href="/register/">
            <span data-en>Register here</span>
            <span data-np>यहाँ दर्ता गर्नुस्</span>
        </a>
    </p>
</div>
{% endblock %}
